<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Blocked</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <main>
    <div class="icon">🚫</div>
    <h1>This site is blocked</h1>
    <p id="blocked-url" class="url"></p>
    <p id="message" class="message">You started a blocking session. Stay focused.</p>

    <div id="unblock-countdown" class="countdown-card" hidden>
      <span class="countdown-label">Unblocks in</span>
      <span id="countdown-value" class="countdown-value">0:00</span>
    </div>

    <div class="emergency-card">
      <h2>Emergency access</h2>
      <p id="remaining" class="remaining"></p>
      <button id="emergency-btn" type="button">Use emergency access</button>
      <p class="hint">Uses your daily cumulative allowance. Time counts while you browse.</p>
    </div>

    <p id="error" class="error" hidden></p>
  </main>
  <script type="module" src="blocked.js"></script>
</body>
</html>
